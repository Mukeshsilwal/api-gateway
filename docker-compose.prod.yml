version: '3.8'

services:
  # ==========================================
  # INFRASTRUCTURE (Databases & Brokers)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      # We rely on an init script or manual creation for multiple DBs. 
      # For simplicity in this generated file, we assume the services might auto-create or we map a volume.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ticket-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - ticket-network
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ticket-network
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ticket-network
    restart: always

  # ==========================================
  # APPLICATION SERVICES
  # ==========================================
  eureka-server:
    image: mukeshsilwal/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - ticket-network
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: always

  gateway:
    image: mukeshsilwal/gateway:latest
    container_name: gateway
    ports:
      - "8222:8222"
    depends_on:
      - eureka-server
    networks:
      - ticket-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_PROFILES_ACTIVE=prod
    restart: always

  auth-service:
    image: mukeshsilwal/auth-service:latest
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - postgres
      - redis
    networks:
      - ticket-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_db
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_REDIS_HOST=redis
      - SPRING_PROFILES_ACTIVE=prod
    restart: always

  booking-service:
    image: mukeshsilwal/booking-service:latest
    container_name: booking-service
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - postgres
      - kafka
    networks:
      - ticket-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/booking_db
      - SPRING_DATASOURCE_PASSWORD=password
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_PROFILES_ACTIVE=prod
    restart: always

  payment-service:
    image: mukeshsilwal/payment-service:latest
    container_name: payment-service
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
      - postgres
    networks:
      - ticket-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/payment_db
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=prod
    restart: always

  web-bff:
    image: mukeshsilwal/web-bff:latest
    container_name: web-bff
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
    networks:
      - ticket-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_PROFILES_ACTIVE=prod
    restart: always

  hotel-service:
    image: mukeshsilwal/hotel-service:latest
    container_name: hotel-service
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
      - postgres
    networks:
      - ticket-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hotel_db
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=prod
    restart: always

  bus-service:
    image: mukeshsilwal/bus-service:latest
    container_name: bus-service
    ports:
      - "8086:8086"
    depends_on:
      - eureka-server
      - postgres
    networks:
      - ticket-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bus_db
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=prod
    restart: always

  market-service:
    image: mukeshsilwal/market-service:latest
    container_name: market-service
    ports:
      - "8087:8087"
    depends_on:
      - eureka-server
      - postgres
    networks:
      - ticket-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/market_db
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=prod
    restart: always

  event-service:
    image: mukeshsilwal/event-service:latest
    container_name: event-service
    ports:
      - "8088:8088"
    depends_on:
      - eureka-server
      - postgres
    networks:
      - ticket-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/event_db
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=prod
    restart: always

  # Frontend served via Nginx (port 80 exposed on host)
  frontend:
    image: mukeshsilwal/frontend:latest
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - ticket-network
    restart: always

volumes:
  postgres_data:


networks:
  ticket-network:
    driver: bridge
