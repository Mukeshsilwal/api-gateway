name: Build, Push and Deploy

on:
  push:
    branches:
      - "**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build artifacts (Maven)
        run: |
          if [ ! -f pom.xml ]; then
            echo "No pom.xml found. Skipping Maven build."
            exit 0
          fi

          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw -T1C -DskipTests clean package
          else
            mvn -T1C -DskipTests clean package
          fi

      # ---------------- GHCR LOGIN ----------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- AWS CREDENTIALS ----------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------- BUILD & PUSH (GHCR + ECR) ----------------
      - name: Build & push Docker images to GHCR and ECR
        env:
          OWNER_LC: ${{ github.repository_owner }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: us-east-1
          IMAGE_TAG: ${{ github.sha }}
        run: |
          OWNER_LC=$(echo "$OWNER_LC" | tr '[:upper:]' '[:lower:]')
          
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::AWS_ACCOUNT_ID secret is not set! Please add it to your repository secrets."
            exit 1
          fi

          if [ -z "$OWNER_LC" ]; then
             echo "::error::Could not determine repository owner."
             exit 1
          fi

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          declare -A services=(
            ["web-bff"]="services/web-bff/Dockerfile"
            ["booking-service"]="services/booking-service/Dockerfile"
            ["payment-service"]="services/payment-service/Dockerfile"
            ["hotel-service"]="services/hotel-service/Dockerfile"
            ["auth-service"]="services/auth-service/Dockerfile"
            ["market-service"]="services/market-service/Dockerfile"
            ["bus-service"]="services/bus-service/Dockerfile"
            ["event-service"]="services/event-service/Dockerfile"
            ["ai-service"]="services/ai-service/Dockerfile"
            ["image-service"]="services/image-service/Dockerfile"
          )

          for service in "${!services[@]}"; do
            dockerfile="${services[$service]}"

            if [ -f "$dockerfile" ]; then
              echo "Building $service..."

              docker build \
                -t ghcr.io/${OWNER_LC}/${service}:${IMAGE_TAG} \
                -t ${ECR_REGISTRY}/${service}:${IMAGE_TAG} \
                -f "$dockerfile" .

              echo "Pushing $service to GHCR..."
              docker push ghcr.io/${OWNER_LC}/${service}:${IMAGE_TAG}

              echo "Pushing $service to ECR..."
              docker push ${ECR_REGISTRY}/${service}:${IMAGE_TAG}
            else
              echo "Dockerfile not found for $service, skipping"
            fi
          done

      # ---------------- EKS DEPLOY ----------------
      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name ticket-katum-cluster --region us-east-1

      - name: Deploy to Kubernetes
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: us-east-1
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          cd infra/k8s

          # Use kustomize edit to update images (replaces existing tags)
          kustomize edit set image \
            booking-service=${REGISTRY}/booking-service:${IMAGE_TAG} \
            web-bff=${REGISTRY}/web-bff:${IMAGE_TAG} \
            payment-service=${REGISTRY}/payment-service:${IMAGE_TAG} \
            hotel-service=${REGISTRY}/hotel-service:${IMAGE_TAG} \
            auth-service=${REGISTRY}/auth-service:${IMAGE_TAG} \
            bus-service=${REGISTRY}/bus-service:${IMAGE_TAG} \
            market-service=${REGISTRY}/market-service:${IMAGE_TAG} \
            event-service=${REGISTRY}/event-service:${IMAGE_TAG} \
            ai-service=${REGISTRY}/ai-service:${IMAGE_TAG} \
            image-service=${REGISTRY}/image-service:${IMAGE_TAG}

          cd ../..

          kubectl apply -k infra/k8s

          for deploy in web-bff booking-service payment-service hotel-service auth-service bus-service market-service event-service ai-service image-service; do
            kubectl rollout status deployment/$deploy --timeout=120s || true
          done
