name: Build, Push and Deploy

on:
  push:
    branches:
      - "**"
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build artifacts (Maven)
        run: |
          if [ ! -f pom.xml ]; then
            echo "No pom.xml found in root directory. Skipping Maven build."
            exit 0
          fi
          
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw -T1C -DskipTests clean package
          else
            mvn -T1C -DskipTests clean package
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          declare -A services=(
            ["web-bff"]="services/web-bff/Dockerfile"
            ["booking-service"]="services/booking-service/Dockerfile"
            ["payment-service"]="services/payment-service/Dockerfile"
            ["hotel-service"]="services/hotel-service/Dockerfile"
            ["auth-service"]="services/auth-service/Dockerfile"
            ["market-service"]="services/market-service/Dockerfile"
            ["bus-service"]="services/bus-service/Dockerfile"
            ["event-service"]="services/event-service/Dockerfile"
            ["ai-service"]="services/ai-service/Dockerfile"
            ["image-service"]="services/image-service/Dockerfile"
          )
          
          for service in "${!services[@]}"; do
            dockerfile="${services[$service]}"
          
            if [ -f "$dockerfile" ]; then
              echo "Building and pushing ${service}..."
              docker build -t $ECR_REGISTRY/$service:$IMAGE_TAG -f "$dockerfile" .
              docker push $ECR_REGISTRY/$service:$IMAGE_TAG
            else
              echo "Warning: Dockerfile not found at ${dockerfile}, skipping ${service}"
            fi
          done

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name ticket-katum-cluster --region us-east-1

      - name: Deploy to Kubernetes
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REGISTRY=$ECR_REGISTRY
          
          cd infra/k8s
          
          # Initialize kustomization.yaml if needed
          if [ ! -f kustomization.yaml ]; then
             echo "resources:" > kustomization.yaml
             find . -name '*deployment.yaml' -o -name 'service.yaml' -o -name 'ingress.yaml' | while read f; do
               echo "  - $f" >> kustomization.yaml
             done
          fi

          # Ensure images section exists
          if ! grep -q "images:" kustomization.yaml; then
            echo -e "\nimages:" >> kustomization.yaml
          fi

          # Update image tags
          cat <<EOF >> kustomization.yaml
            - name: ticketkatum/booking-service
              newName: ${REGISTRY}/booking-service
              newTag: ${IMAGE_TAG}
            - name: ticketkatum/web-bff
              newName: ${REGISTRY}/web-bff
              newTag: ${IMAGE_TAG}
            - name: ticketkatum/payment-service
              newName: ${REGISTRY}/payment-service
              newTag: ${IMAGE_TAG}
            - name: ticketkatum/hotel-service
              newName: ${REGISTRY}/hotel-service
              newTag: ${IMAGE_TAG}
            - name: ticketkatum/auth-service
              newName: ${REGISTRY}/auth-service
              newTag: ${IMAGE_TAG}
            - name: ticketkatum/market-service
              newName: ${REGISTRY}/market-service
              newTag: ${IMAGE_TAG}
            - name: ticketkatum/bus-service
              newName: ${REGISTRY}/bus-service
              newTag: ${IMAGE_TAG}
            - name: ticketkatum/event-service
              newName: ${REGISTRY}/event-service
              newTag: ${IMAGE_TAG}
            - name: ticketkatum/ai-service
              newName: ${REGISTRY}/ai-service
              newTag: ${IMAGE_TAG}
            - name: ticketkatum/image-service
              newName: ${REGISTRY}/image-service
              newTag: ${IMAGE_TAG}
          EOF
          
          cd ../..

          # Apply deployment
          kubectl apply -k infra/k8s

          # Wait for rollout
          for deploy in web-bff booking-service payment-service hotel-service auth-service market-service bus-service event-service ai-service image-service; do
            kubectl rollout status deployment/$deploy --timeout=120s || true
          done
