name: Build, Push and Deploy

on:
  push:
    branches:
      - "**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ticket-Katum-gateway
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build artifacts (Maven)
        run: |
          # Check if pom.xml exists in root
          if [ ! -f pom.xml ]; then
            echo "No pom.xml found in root directory. Skipping Maven build."
            echo "Docker builds will use pre-built artifacts or build within Dockerfile."
            exit 0
          fi
          
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw -T1C -DskipTests clean package
          else
            mvn -T1C -DskipTests clean package
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker images
        env:
          OWNER_LC: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(echo "$OWNER_LC" | tr '[:upper:]' '[:lower:]')
          
          # Array of services with their Dockerfile paths
          declare -A services=(
            ["web-bff"]="bff/web-bff/Dockerfile"
            ["booking-service"]="services/booking-service/Dockerfile"
            ["payment-service"]="services/payment-service/Dockerfile"
            ["hotel-service"]="services/hotel-service/Dockerfile"
            ["auth-service"]="services/auth-service/Dockerfile"
          )
          
          for service in "${!services[@]}"; do
            dockerfile="${services[$service]}"
          
            if [ -f "$dockerfile" ]; then
              echo "Building and pushing ${service}..."
              docker build -t ghcr.io/${OWNER_LC}/${service}:${{ github.sha }} -f "$dockerfile" .
              docker push ghcr.io/${OWNER_LC}/${service}:${{ github.sha }}
            else
              echo "Warning: Dockerfile not found at ${dockerfile}, skipping ${service}"
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name ticket-katum-cluster --region us-east-1

      - name: Deploy to Kubernetes
        env:
          OWNER_LC: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          OWNER_LC=$(echo "$OWNER_LC" | tr '[:upper:]' '[:lower:]')
          REGISTRY="ghcr.io/${OWNER_LC}"
          
          # Generate kustomization.yaml recursively if not exists or needs update
          # Note: We are using k8s-deploy directory directly as it contains the manifests
          
          # Check if kustomization.yaml exists, if not create basic structure
          if [ ! -f k8s-deploy/kustomization.yaml ]; then
             echo "resources:" > k8s-deploy/kustomization.yaml
             find k8s-deploy -name '*deployment.yaml' -o -name 'service.yaml' -o -name 'ingress.yaml' -o -name 'configmaps.yaml' -o -name 'secrets.yaml' | grep -v "kustomization.yaml" | while read f; do
               echo "  - ${f#k8s-deploy/}" >> k8s-deploy/kustomization.yaml
             done
          fi

          # Update kustomization.yaml with new images
          cd k8s-deploy
          
          # Ensure kustomization.yaml has images section if not present
          if ! grep -q "images:" kustomization.yaml; then
            echo -e "\nimages:" >> kustomization.yaml
          fi

          # We need to use kustomize edit or manual append. Let's append to avoid dependency issues if kustomize isn't perfect
          # Actually, let's just append the image overrides. 
          # Warning: This simple appending assumes standard kustomize structure. 
          # A safer way using pure bash without kustomize CLI edit:
          
          cat <<EOF >> kustomization.yaml
            - name: ticketkatum/booking-service
              newName: ${REGISTRY}/booking-service
              newTag: ${IMAGE_TAG}
            - name: web-bff
              newName: ${REGISTRY}/web-bff
              newTag: ${IMAGE_TAG}
            - name: payment-service
              newName: ${REGISTRY}/payment-service
              newTag: ${IMAGE_TAG}
            - name: hotel-service
              newName: ${REGISTRY}/hotel-service
              newTag: ${IMAGE_TAG}
            - name: auth-service
              newName: ${REGISTRY}/auth-service
              newTag: ${IMAGE_TAG}
          EOF
          
          cd ..

          # Apply deployment
          kubectl apply -k k8s-deploy

          # Wait for rollout
          for deploy in web-bff booking-service payment-service hotel-service auth-service; do
            kubectl rollout status deployment/$deploy --timeout=120s || true
          done
