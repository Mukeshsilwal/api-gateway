<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Endpoints Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .test-card {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .test-card h3 {
            margin-top: 0;
            color: #495057;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-right: 10px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .result {
            background: #f1f3f5;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .error {
            border-left-color: #e74c3c;
            background: #ffe6e6;
        }

        .success-result {
            border-left-color: #27ae60;
            background: #e8f8f5;
        }

        label {
            font-weight: 600;
            color: #495057;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎟️ Registration Module Endpoint Tester</h1>
        <p><strong>Base URL:</strong> <span id="baseUrl">http://localhost:8080</span></p>

        <!-- Test 1: Register Admin -->
        <div class="test-card">
            <h3>1. Register Admin (Multipart)</h3>
            <label>Full Name</label>
            <input type="text" id="fullName" value="John Doe">

            <label>Email</label>
            <input type="email" id="email" value="johndoe@example.com">

            <label>Phone</label>
            <input type="text" id="phone" value="9800000000">

            <label>Address</label>
            <input type="text" id="address" value="Kathmandu">

            <label>Role</label>
            <input type="text" id="role" value="ADMIN" readonly>

            <label>Document File</label>
            <input type="file" id="document">

            <button onclick="testRegisterAdmin()">POST /register/admin</button>
            <div id="result1" class="result" style="display:none;"></div>
        </div>

        <!-- Test 2: Get All Requests -->
        <div class="test-card">
            <h3>2. Get All Admin Requests</h3>
            <button class="success" onclick="testGetAllRequests()">GET /register/all-requests</button>
            <div id="result2" class="result" style="display:none;"></div>
        </div>

        <!-- Test 3: Approve Admin -->
        <div class="test-card">
            <h3>3. Approve Admin Request</h3>
            <label>Request ID</label>
            <input type="number" id="approveId" value="1">
            <button onclick="testApproveAdmin()">POST /register/approve/{id}</button>
            <div id="result3" class="result" style="display:none;"></div>
        </div>

        <!-- Test 4: Send OTP -->
        <div class="test-card">
            <h3>4. Send OTP</h3>
            <label>Username</label>
            <input type="text" id="otpUsername" value="johndoe">
            <button onclick="testSendOTP()">POST /register/sent-otp</button>
            <div id="result4" class="result" style="display:none;"></div>
        </div>

        <!-- Test 5: Change Password -->
        <div class="test-card">
            <h3>5. Change Password</h3>
            <label>Username</label>
            <input type="text" id="pwUsername" value="johndoe">

            <label>Old Password</label>
            <input type="password" id="oldPassword" value="oldpass123">

            <label>New Password</label>
            <input type="password" id="newPassword" value="newpass456">

            <button onclick="testChangePassword()">POST /register/change-password</button>
            <div id="result5" class="result" style="display:none;"></div>
        </div>

        <button class="success" onclick="runAllTests()" style="width: 100%; margin-top: 20px; padding: 15px;">
            🚀 Run All Tests
        </button>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8080';

        function showResult(resultId, status, data, isError = false) {
            const resultDiv = document.getElementById(resultId);
            resultDiv.style.display = 'block';
            resultDiv.className = `result ${isError ? 'error' : 'success-result'}`;
            resultDiv.textContent = `Status: ${status}\n\n${JSON.stringify(data, null, 2)}`;
        }

        async function testRegisterAdmin() {
            try {
                const formData = new FormData();
                formData.append('fullName', document.getElementById('fullName').value);
                formData.append('email', document.getElementById('email').value);
                formData.append('phone', document.getElementById('phone').value);
                formData.append('address', document.getElementById('address').value);
                formData.append('role', document.getElementById('role').value);

                const fileInput = document.getElementById('document');
                if (fileInput.files.length > 0) {
                    formData.append('document', fileInput.files[0]);
                }

                const response = await fetch(`${BASE_URL}/register/admin`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                showResult('result1', response.status, data, !response.ok);
            } catch (error) {
                showResult('result1', 'ERROR', { error: error.message }, true);
            }
        }

        async function testGetAllRequests() {
            try {
                const response = await fetch(`${BASE_URL}/register/all-requests`, {
                    method: 'GET'
                });

                const data = await response.json();
                showResult('result2', response.status, data, !response.ok);
            } catch (error) {
                showResult('result2', 'ERROR', { error: error.message }, true);
            }
        }

        async function testApproveAdmin() {
            try {
                const requestId = document.getElementById('approveId').value;
                const response = await fetch(`${BASE_URL}/register/approve/${requestId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                showResult('result3', response.status, data, !response.ok);
            } catch (error) {
                showResult('result3', 'ERROR', { error: error.message }, true);
            }
        }

        async function testSendOTP() {
            try {
                const response = await fetch(`${BASE_URL}/register/sent-otp`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: document.getElementById('otpUsername').value
                    })
                });

                const data = await response.json();
                showResult('result4', response.status, data, !response.ok);
            } catch (error) {
                showResult('result4', 'ERROR', { error: error.message }, true);
            }
        }

        async function testChangePassword() {
            try {
                const response = await fetch(`${BASE_URL}/register/change-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: document.getElementById('pwUsername').value,
                        oldPassword: document.getElementById('oldPassword').value,
                        newPassword: document.getElementById('newPassword').value
                    })
                });

                const data = await response.json();
                showResult('result5', response.status, data, !response.ok);
            } catch (error) {
                showResult('result5', 'ERROR', { error: error.message }, true);
            }
        }

        async function runAllTests() {
            console.log('Running all tests...');
            await testGetAllRequests();
            await new Promise(r => setTimeout(r, 500));
            await testSendOTP();
            await new Promise(r => setTimeout(r, 500));
            await testChangePassword();
            alert('All automated tests completed! Check results above.');
        }
    </script>
</body>

</html>
