version: '3.8'

services:
  monolith-app:
    image: ticket-katum/monolith-app:latest
    build:
      context: ./backend
      dockerfile: monolith-app/Dockerfile # Assuming Dockerfile needs creation or exists
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/travel_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
    depends_on:
      - postgres
    networks:
      - ticket-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=travel_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ticket-network

  frontend:
    image: ticket-katum/frontend:latest
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - monolith-app
    networks:
      - ticket-network

networks:
  ticket-network:
    driver: bridge

volumes:
  postgres-data:
