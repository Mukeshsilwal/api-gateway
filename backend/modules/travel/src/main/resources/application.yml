server:
  port: 8093
  servlet:
    context-path: /

spring:
  application:
    name: travel-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/travel_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      # ========== CONNECTION POOL OPTIMIZATIONS ==========
      maximum-pool-size: 20                       # Increased from 10 for better concurrency
      minimum-idle: 10                            # Increased from 5 to maintain ready connections
      connection-timeout: 30000                   # 30 seconds
      idle-timeout: 600000                        # 10 minutes
      max-lifetime: 1800000                       # 30 minutes - prevents stale connections
      leak-detection-threshold: 60000             # 60 seconds - detect connection leaks

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        
        # ========== PERFORMANCE OPTIMIZATIONS ==========
        
        # Batch Processing - improves INSERT/UPDATE performance
        jdbc:
          batch_size: 50                          # Batch INSERT/UPDATE statements
          fetch_size: 50                          # JDBC fetch size for result sets
        order_inserts: true                       # Order INSERTs for better batching
        order_updates: true                       # Order UPDATEs for better batching
        batch_versioned_data: true                # Batch versioned entities (@Version)
        
        # Fetching Strategy - reduces N+1 queries
        default_batch_fetch_size: 16              # Batch lazy loading (use powers of 2)
        
        # Query Optimization
        query:
          in_clause_parameter_padding: true       # Optimize IN clause with parameter padding
          plan_cache_max_size: 2048               # Query plan cache size
    open-in-view: false                           # Disable OSIV to prevent lazy loading issues

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: travel-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

