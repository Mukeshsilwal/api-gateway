# Booking Service - Production Configuration
spring:
  application:
    name: booking-service
  profiles:
    active: prod

  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://prod-db:5432/booking_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 20
      connection-timeout: 30000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
      compression-type: snappy
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest

  # Redis Configuration
  redis:
    host: ${REDIS_HOST:redis-cluster}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    timeout: 3000
    lettuce:
      pool:
        max-active: 50
        max-idle: 20

# Server Configuration
server:
  port: ${SERVER_PORT:8082}
  tomcat:
    threads:
      max: 500
    max-connections: 10000

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:booking-service}

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      environment: production

# Logging
logging:
  level:
    root: WARN
    com.ticketkatum: INFO
  file:
    name: /var/log/booking-service/application.log
    max-size: 100MB

# Application Specific
app:
  booking:
    lock-timeout-seconds: 300
    max-retry-attempts: 3
    seat-hold-duration-minutes: 15
