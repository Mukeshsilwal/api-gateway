# ============================
# JWT Configuration
# ============================
jwt:
  secret: ${JWT_SECRET:dMbz7o4YE45aAyT6BUYMsO_ireJ00J96Xxbv6AQ65xb0Ajauql1fScOEP4hEb7oyBtjHfTjvkeXBfpSjE8uyoA}

  expiration:
    time: ${JWT_EXPIRATION:3600000}          # 1 hour
  refresh:
    expiration:
      time: ${JWT_REFRESH_EXPIRATION:600000}   # 10 minutes

# ============================
# Spring Configuration
# ============================
spring:
  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:changeme}

    # OAuth2 Client Configuration
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:130041322678-e82m79prh88nhesanq9p3m2s48a85psk.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  session:
    store-type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 6000ms
  # DATABASE (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update     # Creates/updates tables automatically
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ============================
# Logging
# ============================
logging:
  level:
    com.ticketkatum.security: DEBUG
    org.springframework.security: INFO
    io.jsonwebtoken: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# ============================
# Server Configuration
# ============================
server:
  port: ${AUTH_SERVICE_PORT:8089}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# ============================
# SendGrid Email Service
# ============================
sendgrid:
  api:
    key: ${SENDGRID_API_KEY:SG.fakeKey.PLEASE_REPLACE}

# ============================
# Actuator (for health checks)
# ============================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

# ============================
# OAuth2 Configuration
# ============================
app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/callback}
