apiVersion: v1
kind: Namespace
metadata:
  name: ticket-katum
  labels:
    name: ticket-katum
    environment: production
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-service
  namespace: ticket-katum
  labels:
    app: hotel-service
    tier: backend
spec:
  selector:
    app: hotel-service
  ports:
    - port: 8087
      targetPort: 8087
      protocol: TCP
      name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
  namespace: ticket-katum
  labels:
    app: hotel-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hotel-service
  template:
    metadata:
      labels:
        app: hotel-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8087"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: hotel-service
          image: ticketkatum/hotel-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
              name: http
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: EUREKA_SERVER_URL
              value: "http://eureka-server:8761/eureka/"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: hotel-db-secret
                  key: url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hotel-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-db-secret
                  key: password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: host
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
            - name: ACTIVEMQ_USER
              valueFrom:
                secretKeyRef:
                  name: activemq-secret
                  key: username
            - name: ACTIVEMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: activemq-secret
                  key: password
