spring:
  application:
    name: booking-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

    activemq:
      broker-url: tcp://localhost:61616
      user: ${ACTIVEMQ_USER:admin}
      password: ${ACTIVEMQ_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: update   # Flyway is enabled → keep this as NONE
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
esewa:
  merchant-code: ESEWATEST
  success-url: https://localhost:3000/payments/esewa/success
  failure-url: https://localhost:3000/payments/esewa/failure
  base-url: https://esewa.com.np/epay/main



  redis:
    lettuce:
      pool:
        max-active: 50
        max-idle: 10
        min-idle: 5

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:redis_password}
      timeout: 60000

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:ticketkatum}
    password: ${SPRING_RABBITMQ_PASSWORD:ticketkatum_password}
    listener:
      simple:
        retry:
          enabled: false
          initial-interval: 2000
          max-attempts: 3
          multiplier: 2

server:
  port: 8091
  compression:
    enabled: true
  http2:
    enabled: true

sendgrid:
  api:
    key: ${SENDGRID_API_KEY:REPLACE_ME}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info

  metrics:
    tags:
      application: ${spring.application.name}

  endpoint:
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.ticketkatum: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
