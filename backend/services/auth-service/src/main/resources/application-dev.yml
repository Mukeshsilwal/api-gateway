# Auth Service - Development Configuration
spring:
  application:
    name: auth-service
  profiles:
    active: dev

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    timeout: 3000

# Server Configuration
server:
  port: 8084

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# Logging
logging:
  level:
    root: INFO
    com.ticketkatum: DEBUG
    org.springframework.security: DEBUG
  file:
    name: logs/auth-service-dev.log

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyForDevelopmentOnlyDoNotUseInProduction12345}
  expiration: 3600000  # 1 hour in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds
  issuer: ticketkatum-auth
  algorithm: RS256

# Security Configuration
security:
  allowed-origins: http://localhost:3000,http://localhost:5173
  session:
    max-concurrent-sessions: 5
    timeout-minutes: 30
  password:
    min-length: 8
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special-char: true
