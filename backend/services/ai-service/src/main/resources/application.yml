server:
  port: 8095

spring:
  application:
    name: ai-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# OpenAI Configuration
openai:
  api:
    key: ${OPENAI_API_KEY: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}
  model: gpt-4o-mini
  max-tokens: 500
  temperature: 0.7

# Chatbot Configuration
chatbot:
  max-conversation-history: 10
  conversation-ttl: 3600 # 1 hour in seconds
  rate-limit:
    requests-per-minute: 20
    requests-per-hour: 100

# Logging
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-NO-CORRELATION-ID}] %-5level %logger{36} - %msg%n"
  level:
    com.ticketkatum: DEBUG
    org.springframework.web: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# Eureka (if using service discovery)
eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
