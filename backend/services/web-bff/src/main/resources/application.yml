# ============================================================
# NOTIFICATION CONFIGURATION
# Email & SMS Settings
# ============================================================
notification:
  email:
    enabled: ${EMAIL_ENABLED:true}
    from: noreply@ticketkatum.com
    smtp:
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      auth: true
      starttls: true

  sms:
    enabled: ${SMS_ENABLED:false}
    provider: ${SMS_PROVIDER:sparrow}
    api-key: ${SMS_API_KEY:}

# ============================================================
# FILE UPLOAD CONFIGURATION
# ============================================================

# ============================================================
# PROFILES
# ============================================================
---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.ticketkatum: DEBUG

features:
  email-notifications: false
  sms-notifications: false

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    com.ticketkatum: INFO

features:
  email-notifications: true
  sms-notifications: true

rate-limit:
  requests-per-minute: 60

---
# Staging Profile
spring:
  config:
    activate:
      on-profile: staging

logging:
  level:
    com.ticketkatum: INFO

features:
  email-notifications: true
  sms-notifications: false