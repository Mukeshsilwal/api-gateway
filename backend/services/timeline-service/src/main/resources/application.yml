spring:
  application:
    name: timeline-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/timeline_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: timeline-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8088
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Timeline Service Configuration
timeline:
  websocket:
    enabled: true
    endpoint: /ws/timeline
  
  checkpoint:
    auto-complete-threshold-minutes: 30
    reminder-before-minutes: 15
  
  external-services:
    journey-service-url: http://localhost:8087
    tracking-service-url: http://localhost:8089

# Logging
logging:
  level:
    root: INFO
    com.ticketkatum: DEBUG
    org.springframework.web: INFO
    org.springframework.messaging: DEBUG

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
