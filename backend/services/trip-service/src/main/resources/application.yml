server:
  port: 8095
  servlet:
    context-path: /trip-service

spring:
  application:
    name: trip-service
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trip_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      # ========== CONNECTION POOL OPTIMIZATIONS ==========
      maximum-pool-size: 20                       # Increased from 10 for better concurrency
      minimum-idle: 10                            # Increased from 5 to maintain ready connections
      connection-timeout: 30000                   # 30 seconds
      idle-timeout: 600000                        # 10 minutes
      max-lifetime: 1800000                       # 30 minutes - prevents stale connections
      leak-detection-threshold: 60000             # 60 seconds - detect connection leaks
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        
        # ========== PERFORMANCE OPTIMIZATIONS ==========
        
        # Batch Processing - improves INSERT/UPDATE performance
        jdbc:
          batch_size: 50                          # Increased from 20 for better batching
          fetch_size: 50                          # JDBC fetch size for result sets
        order_inserts: true                       # Order INSERTs for better batching
        order_updates: true                       # Order UPDATEs for better batching
        batch_versioned_data: true                # Batch versioned entities (@Version)
        
        # Fetching Strategy - reduces N+1 queries
        default_batch_fetch_size: 16              # Batch lazy loading (use powers of 2)
        
        # Query Optimization
        query:
          in_clause_parameter_padding: true       # Optimize IN clause with parameter padding
          plan_cache_max_size: 2048               # Query plan cache size
        
        # Connection & Statement Management
        connection:
          provider_disables_autocommit: true      # Performance optimization for connections
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  cache:
    type: redis
    redis:
      time-to-live: 3600000
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: trip-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: com.ticketkatum.dto.EventBookingCreatedEvent:com.ticketkatum.tripservice.event.external.EventBookingCreatedEvent,com.ticketkatum.dto.HotelBookingCreatedEvent:com.ticketkatum.tripservice.event.external.HotelBookingCreatedEvent,com.ticketkatum.dto.BusBookingCreatedEvent:com.ticketkatum.tripservice.event.external.BusBookingCreatedEvent

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production}
  expiration: 86400000

# Service URLs for inter-service communication
services:
  booking-service:
    url: ${BOOKING_SERVICE_URL:http://localhost:8091/booking-service}
  bus-service:
    url: ${BUS_SERVICE_URL:http://localhost:8086/bus-service}
  hotel-service:
    url: ${HOTEL_SERVICE_URL:http://localhost:8087/hotel-service}
  event-service:
    url: ${EVENT_SERVICE_URL:http://localhost:8093/api/events}
  tracking-service:
    url: ${TRACKING_SERVICE_URL:http://localhost:8097/tracking-service}
  alert-service:
    url: ${ALERT_SERVICE_URL:http://localhost:8094/alert-service}

# Logging
logging:
  level:
    root: INFO
    com.ticketkatum.tripservice: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      bookingService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
