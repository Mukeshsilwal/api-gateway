# ============================================================
# Eureka Server Configuration
# ============================================================

spring:
  application:
    name: eureka-server

server:
  port: ${EUREKA_PORT:8761}

# ============================================================
# Eureka Server Configuration
# ============================================================
eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    
    # Lease renewal interval (heartbeat)
    lease-renewal-interval-in-seconds: 30
    
    # Lease expiration duration
    lease-expiration-duration-in-seconds: 90
    
    # Instance ID
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    
    # Metadata
    metadata-map:
      zone: ${EUREKA_ZONE:zone1}
      version: ${project.version:1.0.0}
  
  client:
    # Register with Eureka (false for standalone server)
    register-with-eureka: ${EUREKA_REGISTER:false}
    
    # Fetch registry (false for standalone server)
    fetch-registry: ${EUREKA_FETCH:false}
    
    # Service URL
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://${eureka.instance.hostname}:${server.port}/eureka/}
    
    # Registry fetch interval
    registry-fetch-interval-seconds: 30
  
  server:
    # Enable self-preservation mode
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}
    
    # Eviction interval
    eviction-interval-timer-in-ms: 60000
    
    # Response cache update interval
    response-cache-update-interval-ms: 30000
    
    # Response cache auto expiration
    response-cache-auto-expiration-in-seconds: 180
    
    # Renewal threshold
    renewal-percent-threshold: 0.85
    
    # Wait time on startup
    wait-time-in-ms-when-sync-empty: 0

# ============================================================
# Management & Monitoring
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
  
  endpoint:
    health:
      show-details: always
      show-components: always
  
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# ============================================================
# Security Configuration (Optional)
# ============================================================
spring:
  security:
    user:
      name: ${EUREKA_USERNAME:admin}
      password: ${EUREKA_PASSWORD:admin}

# ============================================================
# Logging Configuration
# ============================================================
logging:
  level:
    com.netflix.eureka: ${EUREKA_LOG_LEVEL:INFO}
    com.netflix.discovery: ${DISCOVERY_LOG_LEVEL:INFO}
  
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# ============================================================
# Profile-Specific Overrides
# ============================================================
---
spring:
  config:
    activate:
      on-profile: dev

eureka:
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

logging:
  level:
    com.netflix.eureka: DEBUG
    com.netflix.discovery: DEBUG

---
spring:
  config:
    activate:
      on-profile: staging

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/

---
spring:
  config:
    activate:
      on-profile: prod

server:
  port: ${EUREKA_PORT:8761}

eureka:
  instance:
    prefer-ip-address: true
  
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/,http://eureka-peer3:8763/eureka/}
  
  server:
    enable-self-preservation: true
    renewal-percent-threshold: 0.85

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
