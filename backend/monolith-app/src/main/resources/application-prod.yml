# Web BFF - Production Configuration
spring:
  application:
    name: web-bff
  profiles:
    active: prod

  # Redis Configuration (for caching and session management)
  redis:
    host: ${REDIS_HOST:redis-cluster}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    timeout: 3000
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 10
        max-wait: 3000

# Microservices URLs Configuration
microservices:
  event-service-url: ${EVENT_SERVICE_URL:http://event-service:8081}
  booking-service-url: ${BOOKING_SERVICE_URL:http://booking-service:8082}
  payment-service-url: ${PAYMENT_SERVICE_URL:http://payment-service:8083}
  hotel-service-url: ${HOTEL_SERVICE_URL:http://hotel-service:8087}
  auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:8084}
  bus-service-url: ${BUS_SERVICE_URL:http://booking-service:8082}
  market-service-url: ${MARKET_SERVICE_URL:http://market-service:8092}
  
  # Additional service URLs
  recommendation-service-url: ${RECOMMENDATION_SERVICE_URL:http://hotel-service:8087}
  maintenance-service-url: ${MAINTENANCE_SERVICE_URL:http://hotel-service:8087}
  staff-service-url: ${STAFF_SERVICE_URL:http://hotel-service:8087}
  image-service-url: ${IMAGE_SERVICE_URL:http://payment-service:8086}
  user-service-url: ${USER_SERVICE_URL:http://auth-service:8084}
  registration-service-url: ${REGISTRATION_SERVICE_URL:http://auth-service:8084}
  bus-stop-service-url: ${BUS_STOP_SERVICE_URL:http://booking-service:8082}
  route-service-url: ${ROUTE_SERVICE_URL:http://booking-service:8082}
  seat-service-url: ${SEAT_SERVICE_URL:http://booking-service:8082}
  ticket-service-url: ${TICKET_SERVICE_URL:http://booking-service:8082}
  bus-booking-service-url: ${BUS_BOOKING_SERVICE_URL:http://booking-service:8082}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8091}
  email-service-url: ${EMAIL_SERVICE_URL:http://notification-service:8092}
  sms-service-url: ${SMS_SERVICE_URL:http://notification-service:8093}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  tomcat:
    threads:
      max: 500
      min-spare: 100
    max-connections: 10000
    accept-count: 1000
    connection-timeout: 20000

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    hostname: ${HOSTNAME:web-bff}
    metadata-map:
      zone: ${ZONE:default}

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: production
      zone: ${ZONE:default}

# Logging Configuration
logging:
  level:
    root: WARN
    com.ticketkatum: INFO
    org.springframework.web: WARN
    org.springframework.cloud: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/web-bff/application.log
    max-size: 100MB
    max-history: 30

# Downstream Service URLs (via Eureka)
services:
  event-service:
    url: http://event-service
    connect-timeout: 3000
    read-timeout: 10000
  
  booking-service:
    url: http://booking-service
    connect-timeout: 3000
    read-timeout: 10000
  
  payment-service:
    url: http://payment-service
    connect-timeout: 3000
    read-timeout: 20000
  
  hotel-service:
    url: http://hotel-service
    connect-timeout: 3000
    read-timeout: 10000
  
  auth-service:
    url: http://auth-service
    connect-timeout: 2000
    read-timeout: 5000

# WebClient Configuration
webclient:
  max-connections: 1000
  pending-acquire-timeout: 45000
  max-idle-time: 20000
  max-life-time: 60000
  evict-in-background: 120000

# Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      eventService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 5s
        record-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
      
      bookingService:
        register-health-indicator: true
        sliding-window-size: 20
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
      
      paymentService:
        register-health-indicator: true
        sliding-window-size: 20
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 60s
        failure-rate-threshold: 40
        slow-call-duration-threshold: 10s
      
      hotelService:
        register-health-indicator: true
        sliding-window-size: 20
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50

  # Retry Configuration
  retry:
    instances:
      eventService:
        max-attempts: 3
        wait-duration: 1000ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
      
      bookingService:
        max-attempts: 3
        wait-duration: 1000ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
      
      paymentService:
        max-attempts: 2
        wait-duration: 2000ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

  # Rate Limiter Configuration
  ratelimiter:
    instances:
      default:
        limit-for-period: 1000
        limit-refresh-period: 1s
        timeout-duration: 0
      
      payment:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0

  # Bulkhead Configuration
  bulkhead:
    instances:
      default:
        max-concurrent-calls: 100
        max-wait-duration: 0
      
      payment:
        max-concurrent-calls: 50
        max-wait-duration: 0

# CORS Configuration
cors:
  allowed-origins: ${ALLOWED_ORIGINS:https://ticketkatum.com,https://www.ticketkatum.com}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Cache Configuration
cache:
  event-details:
    ttl: 600  # 10 minutes
  hotel-list:
    ttl: 1800  # 30 minutes
  bus-routes:
    ttl: 3600  # 1 hour

# API Rate Limiting
rate-limit:
  enabled: true
  requests-per-minute: ${RATE_LIMIT_PER_MINUTE:1000}
  requests-per-hour: ${RATE_LIMIT_PER_HOUR:10000}

# Session Configuration
session:
  timeout-minutes: 30
  max-concurrent-sessions: 5

# Security
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000
  
  cors:
    enabled: true
    
  rate-limiting:
    enabled: true
