# ============================================================
# HikariCP Connection Pool Configuration
# ============================================================
# Optimized for production workloads
# ============================================================

spring:
  datasource:
    # ========== HikariCP Configuration ==========
    hikari:
      # Pool sizing
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      
      # Connection timeout
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}  # 30 seconds
      
      # Idle timeout
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}  # 10 minutes
      
      # Max lifetime
      max-lifetime: ${DB_MAX_LIFETIME:1800000}  # 30 minutes
      
      # Leak detection
      leak-detection-threshold: ${DB_LEAK_DETECTION:60000}  # 60 seconds
      
      # Connection test query
      connection-test-query: SELECT 1
      
      # Pool name
      pool-name: ${spring.application.name}-pool
      
      # Auto-commit
      auto-commit: true
      
      # Read-only
      read-only: false
      
      # Isolation level
      transaction-isolation: TRANSACTION_READ_COMMITTED
      
      # Validation timeout
      validation-timeout: 5000
      
      # Connection initialization SQL
      connection-init-sql: SELECT 1
      
      # Data source properties
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false

# ============================================================
# JPA/Hibernate Configuration
# ============================================================
  jpa:
    # Hibernate DDL auto
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}  # validate in prod, update in dev
    
    # Show SQL
    show-sql: ${HIBERNATE_SHOW_SQL:false}
    
    # Properties
    properties:
      hibernate:
        # Dialect
        dialect: org.hibernate.dialect.PostgreSQLDialect
        
        # Format SQL
        format_sql: true
        
        # Use SQL comments
        use_sql_comments: true
        
        # JDBC batch size
        jdbc:
          batch_size: 20
          fetch_size: 50
        
        # Order inserts/updates
        order_inserts: true
        order_updates: true
        
        # Query plan cache
        query:
          plan_cache_max_size: 2048
          plan_parameter_metadata_max_size: 128
        
        # Second-level cache
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        
        # Statistics
        generate_statistics: ${HIBERNATE_STATISTICS:false}
        
        # Connection handling
        connection:
          provider_disables_autocommit: true
        
        # Schema management
        default_schema: public

# ============================================================
# Database Monitoring
# ============================================================
management:
  metrics:
    enable:
      hikaricp: true
    export:
      prometheus:
        enabled: true
  
  health:
    db:
      enabled: true
    
  endpoint:
    health:
      show-details: always
      show-components: always

# ============================================================
# Logging Configuration
# ============================================================
logging:
  level:
    com.zaxxer.hikari: ${HIKARI_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${SQL_PARAM_LOG_LEVEL:WARN}
    org.hibernate.stat: ${HIBERNATE_STAT_LOG_LEVEL:WARN}

# ============================================================
# Profile-Specific Overrides
# ============================================================
---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      leak-detection-threshold: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true

logging:
  level:
    com.zaxxer.hikari: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
spring:
  config:
    activate:
      on-profile: staging

  datasource:
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
  
  jpa:
    hibernate:
      ddl-auto: validate

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 20000
      leak-detection-threshold: 120000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false

logging:
  level:
    com.zaxxer.hikari: WARN
    org.hibernate.SQL: WARN
