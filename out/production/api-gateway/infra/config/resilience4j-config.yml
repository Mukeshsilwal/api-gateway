# ============================================================
# Resilience4j Configuration
# ============================================================

resilience4j:
  # ========== Circuit Breaker Configuration ==========
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 100
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        ignoreExceptions:
          - com.ticketkatum.exception.BusinessException
    
    instances:
      hotelService:
        baseConfig: default
        waitDurationInOpenState: 15s
        failureRateThreshold: 40
      
      bookingService:
        baseConfig: default
        waitDurationInOpenState: 20s
        failureRateThreshold: 45
      
      paymentService:
        baseConfig: default
        waitDurationInOpenState: 30s
        failureRateThreshold: 30
        minimumNumberOfCalls: 5
      
      authService:
        baseConfig: default
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
      
      database:
        slidingWindowSize: 50
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 30s
        failureRateThreshold: 60
        permittedNumberOfCallsInHalfOpenState: 3
      
      cache:
        slidingWindowSize: 50
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 70
        permittedNumberOfCallsInHalfOpenState: 5

  # ========== Retry Configuration ==========
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        ignoreExceptions:
          - com.ticketkatum.exception.BusinessException
          - java.lang.IllegalArgumentException
    
    instances:
      hotelService:
        baseConfig: default
        maxAttempts: 3
        waitDuration: 1s
      
      bookingService:
        baseConfig: default
        maxAttempts: 4
        waitDuration: 500ms
      
      paymentService:
        baseConfig: default
        maxAttempts: 5
        waitDuration: 2s
        exponentialBackoffMultiplier: 3
      
      database:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      
      cache:
        maxAttempts: 2
        waitDuration: 100ms
        enableExponentialBackoff: false

  # ========== Bulkhead Configuration ==========
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 25
        maxWaitDuration: 0ms
    
    instances:
      hotelService:
        maxConcurrentCalls: 50
        maxWaitDuration: 100ms
      
      bookingService:
        maxConcurrentCalls: 30
        maxWaitDuration: 200ms
      
      paymentService:
        maxConcurrentCalls: 20
        maxWaitDuration: 500ms
      
      database:
        maxConcurrentCalls: 100
        maxWaitDuration: 0ms
      
      cache:
        maxConcurrentCalls: 200
        maxWaitDuration: 0ms

  # ========== Thread Pool Bulkhead Configuration ==========
  thread-pool-bulkhead:
    configs:
      default:
        maxThreadPoolSize: 10
        coreThreadPoolSize: 5
        queueCapacity: 50
        keepAliveDuration: 20ms
    
    instances:
      hotelService:
        maxThreadPoolSize: 20
        coreThreadPoolSize: 10
        queueCapacity: 100
      
      paymentService:
        maxThreadPoolSize: 15
        coreThreadPoolSize: 8
        queueCapacity: 75

  # ========== Rate Limiter Configuration ==========
  ratelimiter:
    configs:
      default:
        registerHealthIndicator: true
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0ms
        eventConsumerBufferSize: 100
    
    instances:
      hotelService:
        limitForPeriod: 200
        limitRefreshPeriod: 1s
      
      paymentService:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 500ms
      
      publicApi:
        limitForPeriod: 1000
        limitRefreshPeriod: 1s

  # ========== Time Limiter Configuration ==========
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true
    
    instances:
      hotelService:
        timeoutDuration: 3s
      
      bookingService:
        timeoutDuration: 5s
      
      paymentService:
        timeoutDuration: 10s
      
      database:
        timeoutDuration: 2s
      
      cache:
        timeoutDuration: 500ms

# ============================================================
# Management Endpoints for Resilience4j
# ============================================================
management:
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        resilience4j.circuitbreaker.calls: true
        resilience4j.retry.calls: true
        resilience4j.bulkhead.calls: true
  
  endpoint:
    health:
      show-details: always
      show-components: always
