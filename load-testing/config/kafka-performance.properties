# Kafka Performance Tuning for 10k events/sec

# Broker Configuration
num.network.threads=8
num.io.threads=16
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# Log Configuration
num.partitions=10
default.replication.factor=3
min.insync.replicas=2
log.retention.hours=168
log.segment.bytes=1073741824

# Performance Tuning
compression.type=snappy
log.flush.interval.messages=10000
log.flush.interval.ms=1000

# Producer Optimization
max.in.flight.requests.per.connection=5
acks=all
linger.ms=10
batch.size=32768

# Consumer Optimization
fetch.min.bytes=1024
fetch.max.wait.ms=500
max.poll.records=500

# Memory and Threading
num.replica.fetchers=4
replica.fetch.max.bytes=1048576

# JVM Options for Kafka
# Add to kafka-server-start.sh or environment
# KAFKA_HEAP_OPTS="-Xmx6G -Xms6G"
# KAFKA_JVM_PERFORMANCE_OPTS="-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:G1HeapRegionSize=16M"
