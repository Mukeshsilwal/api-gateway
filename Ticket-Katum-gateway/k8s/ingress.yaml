apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticket-katum-ingress
  namespace: ticket-katum
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  tls:
  - hosts:
    - api.ticketkatum.com
    - www.ticketkatum.com
    secretName: ticketkatum-tls
  rules:
  - host: api.ticketkatum.com
    http:
      paths:
      # Web BFF
      - path: /api/bff
        pathType: Prefix
        backend:
          service:
            name: web-bff
            port:
              number: 8081
      
      # Mobile BFF
      - path: /api/mobile
        pathType: Prefix
        backend:
          service:
            name: mobile-bff
            port:
              number: 8082
      
      # Auth Service (direct access for login/register)
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8089
      
      # Monitoring (restricted)
      - path: /prometheus
        pathType: Prefix
        backend:
          service:
            name: prometheus-service
            port:
              number: 9090
      
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
      
      # Eureka Dashboard (restricted)
      - path: /eureka
        pathType: Prefix
        backend:
          service:
            name: eureka-server
            port:
              number: 8761
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ticket-katum
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-bff
  namespace: ticket-katum
spec:
  podSelector:
    matchLabels:
      tier: bff
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bff-to-services
  namespace: ticket-katum
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: bff
    ports:
    - protocol: TCP
      port: 8087
    - protocol: TCP
      port: 8091
    - protocol: TCP
      port: 8083
    - protocol: TCP
      port: 8092
    - protocol: TCP
      port: 8089
