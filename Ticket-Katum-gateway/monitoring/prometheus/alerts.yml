groups:
  # ==========================================
  # Service Availability Alerts
  # ==========================================
  - name: service_availability
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job="spring-boot-services"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} has been down for more than 1 minute. Immediate action required."
          runbook_url: "https://wiki.ticketkatum.com/runbooks/service-down"

      - alert: ServiceFlapping
        expr: changes(up{job="spring-boot-services"}[5m]) > 3
        for: 5m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Service {{ $labels.instance }} is flapping"
          description: "{{ $labels.instance }} has restarted {{ $value }} times in the last 5 minutes."

  # ==========================================
  # Performance Alerts
  # ==========================================
  - name: performance
    interval: 30s
    rules:
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High response time on {{ $labels.instance }}"
          description: "95th percentile response time is {{ $value }}s on {{ $labels.instance }}."

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "High error rate on {{ $labels.instance }}"
          description: "Error rate is {{ $value }} on {{ $labels.instance }} (threshold: 0.05)."

      - alert: SlowDatabaseQueries
        expr: histogram_quantile(0.95, rate(hikaricp_connections_acquire_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Slow database queries on {{ $labels.instance }}"
          description: "Database connection acquisition time is {{ $value }}s."

  # ==========================================
  # Resource Utilization Alerts
  # ==========================================
  - name: resource_utilization
    interval: 30s
    rules:
      - alert: HighMemoryUsage
        expr: (jvm_memory_used_bytes / jvm_memory_max_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}."

      - alert: HighCPUUsage
        expr: process_cpu_usage > 0.8
        for: 5m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: critical
          category: resources
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Only {{ $value | humanizePercentage }} disk space remaining."

  # ==========================================
  # Database Alerts
  # ==========================================
  - name: database
    interval: 30s
    rules:
      - alert: DatabaseConnectionPoolExhaustion
        expr: (hikaricp_connections_active / hikaricp_connections_max) > 0.9
        for: 2m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "Database connection pool nearly exhausted on {{ $labels.instance }}"
          description: "Connection pool usage is {{ $value | humanizePercentage }}."

      - alert: DatabaseConnectionTimeout
        expr: rate(hikaricp_connections_timeout_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "Database connection timeouts on {{ $labels.instance }}"
          description: "{{ $value }} connection timeouts per second."

      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database has been down for more than 1 minute."

  # ==========================================
  # Cache Alerts
  # ==========================================
  - name: cache
    interval: 30s
    rules:
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          category: cache
        annotations:
          summary: "Redis is down"
          description: "Redis cache has been down for more than 1 minute."

      - alert: LowCacheHitRate
        expr: rate(cache_gets_total{result="hit"}[5m]) / rate(cache_gets_total[5m]) < 0.5
        for: 10m
        labels:
          severity: warning
          category: cache
        annotations:
          summary: "Low cache hit rate on {{ $labels.instance }}"
          description: "Cache hit rate is {{ $value | humanizePercentage }} (threshold: 50%)."

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          category: cache
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory usage is {{ $value | humanizePercentage }}."

  # ==========================================
  # Message Queue Alerts
  # ==========================================
  - name: message_queue
    interval: 30s
    rules:
      - alert: RabbitMQDown
        expr: up{job="rabbitmq"} == 0
        for: 1m
        labels:
          severity: critical
          category: messaging
        annotations:
          summary: "RabbitMQ is down"
          description: "RabbitMQ message broker has been down for more than 1 minute."

      - alert: HighQueueDepth
        expr: rabbitmq_queue_messages > 1000
        for: 5m
        labels:
          severity: warning
          category: messaging
        annotations:
          summary: "High queue depth in {{ $labels.queue }}"
          description: "Queue {{ $labels.queue }} has {{ $value }} messages."

      - alert: MessageProcessingLag
        expr: rate(rabbitmq_queue_messages_published_total[5m]) > rate(rabbitmq_queue_messages_delivered_total[5m]) * 2
        for: 10m
        labels:
          severity: warning
          category: messaging
        annotations:
          summary: "Message processing lag detected"
          description: "Messages are being published faster than consumed."

  # ==========================================
  # Circuit Breaker Alerts
  # ==========================================
  - name: circuit_breaker
    interval: 30s
    rules:
      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 2m
        labels:
          severity: critical
          category: resilience
        annotations:
          summary: "Circuit breaker open for {{ $labels.name }}"
          description: "Circuit breaker {{ $labels.name }} has been open for more than 2 minutes."

      - alert: HighCircuitBreakerFailureRate
        expr: rate(resilience4j_circuitbreaker_calls_total{kind="failed"}[5m]) / rate(resilience4j_circuitbreaker_calls_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          category: resilience
        annotations:
          summary: "High failure rate for {{ $labels.name }}"
          description: "Circuit breaker {{ $labels.name }} failure rate is {{ $value | humanizePercentage }}."

  # ==========================================
  # API Gateway Alerts
  # ==========================================
  - name: api_gateway
    interval: 30s
    rules:
      - alert: KongDown
        expr: up{job="kong"} == 0
        for: 1m
        labels:
          severity: critical
          category: gateway
        annotations:
          summary: "Kong API Gateway is down"
          description: "Kong has been down for more than 1 minute."

      - alert: HighGatewayLatency
        expr: histogram_quantile(0.95, rate(kong_latency_bucket[5m])) > 1000
        for: 5m
        labels:
          severity: warning
          category: gateway
        annotations:
          summary: "High API Gateway latency"
          description: "95th percentile latency is {{ $value }}ms."

  # ==========================================
  # Business Metrics Alerts
  # ==========================================
  - name: business_metrics
    interval: 1m
    rules:
      - alert: LowBookingRate
        expr: rate(bookings_created_total[1h]) < 10
        for: 30m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Low booking rate detected"
          description: "Only {{ $value }} bookings per hour in the last 30 minutes."

      - alert: HighPaymentFailureRate
        expr: rate(payments_failed_total[5m]) / rate(payments_total[5m]) > 0.1
        for: 10m
        labels:
          severity: critical
          category: business
        annotations:
          summary: "High payment failure rate"
          description: "Payment failure rate is {{ $value | humanizePercentage }} (threshold: 10%)."
