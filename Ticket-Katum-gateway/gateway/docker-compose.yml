version: '3.8'

services:
  # =========================
  # Kong DB
  # =========================
  kong-database:
    image: postgres:15-alpine
    container_name: kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: ${KONG_DB_PASSWORD:-kong_password}
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    networks:
      - ticket-katum-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kong" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # =========================
  # Kong Migration
  # =========================
  kong-migration:
    image: kong:3.4
    container_name: kong-migration
    command: [ "kong", "migrations", "bootstrap" ]
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD:-kong_password}
      KONG_PG_DATABASE: kong
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - ticket-katum-network
    restart: on-failure

  # =========================
  # Kong Gateway
  # =========================
  kong:
    image: kong:3.4
    container_name: kong-gateway
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD:-kong_password}
      KONG_PG_DATABASE: kong
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PLUGINS: bundled,jwt,key-auth,cors,acl,rate-limiting,response-transformer,request-transformer,prometheus,http-log
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
      - kong-logs:/tmp/kong
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    networks:
      - ticket-katum-network
    restart: unless-stopped

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7-alpine
    container_name: redis-kong
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_password}" ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ticket-katum-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "PING" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =========================
  # Konga (UI)
  # =========================
  konga:
    image: pantsel/konga:latest
    container_name: konga-ui
    environment:
      NODE_ENV: production
      DB_ADAPTER: postgres
      DB_HOST: kong-database
      DB_PORT: 5432
      DB_USER: kong
      DB_PASSWORD: ${KONG_DB_PASSWORD:-kong_password}
      DB_DATABASE: konga
      TOKEN_SECRET: ${KONGA_TOKEN_SECRET:-change-me}
    ports:
      - "1337:1337"
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - ticket-katum-network
    restart: unless-stopped

  # =========================
  # Microservices (build contexts point outside gateway directory)
  # =========================
  web-bff:
    build:
      context: ../bff/web-bff
      dockerfile: Dockerfile
    container_name: web-bff
    ports:
      - "8080:8080"
    networks:
      - ticket-katum-network
    depends_on:
      - redis
      - kong

  booking-service:
    build:
      context: ../services/booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    ports:
      - "8091:8091"
    networks:
      - ticket-katum-network

  payment-service:
    build:
      context: ../services/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8085:8085"
    networks:
      - ticket-katum-network

  hotel-service:
    build:
      context: ../services/hotel-service
      dockerfile: Dockerfile
    container_name: hotel-service
    ports:
      - "8087:8087"
    networks:
      - ticket-katum-network

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8090:8090"
    networks:
      - ticket-katum-network
  
  bus-service:
    build:
      context: ../services/bus-service
      dockerfile: Dockerfile
    container_name: bus-service
    ports:
      - "8086:8086"
    networks:
      - ticket-katum-network

  market-service:
    build:
      context: ../services/market-service
      dockerfile: Dockerfile
    container_name: market-service
    ports:
      - "8092:8092"
    networks:
      - ticket-katum-network

# =========================
# Networks & Volumes
# =========================
networks:
  ticket-katum-network:
    driver: bridge

volumes:
  kong-db-data:
  kong-logs:
  redis-data: