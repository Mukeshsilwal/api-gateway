
services:
  # ==================================================================
  # PostgreSQL (Kong DB)
  # ==================================================================
  kong-database:
    image: postgres:15-alpine
    container_name: kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: ${KONG_DB_PASSWORD:-kong_password}
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    networks:
      - ticket-katum-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ==================================================================
  # Kong DB Migration
  # ==================================================================
  kong-migration:
    image: kong:3.0-alpine
    container_name: kong-migration
    command: ["kong", "migrations", "bootstrap"]
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD:-kong_password}
      KONG_PG_DATABASE: kong
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - ticket-katum-network
    restart: on-failure

  # ==================================================================
  # Kong Gateway
  # ==================================================================
  kong:
    image: kong:3.0-alpine
    container_name: kong-gateway
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD:-kong_password}
      KONG_PG_DATABASE: kong

      # Logging
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr

      # Listen Ports
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl

      # Plugins
      KONG_PLUGINS: bundled,jwt,key-auth,cors,acl,rate-limiting,response-transformer,request-transformer,prometheus,http-log

      # Declarative config
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml

      # Security
      KONG_HEADERS: "off"
      KONG_TRUSTED_IPS: 0.0.0.0/0,::/0

    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"

    volumes:
      - ./kong.yml:/kong/declarative/kong.yml:ro
      - kong-logs:/tmp/kong

    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully

    networks:
      - ticket-katum-network

    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  # ==================================================================
  # Redis (Used by plugins like rate-limiting)
  # ==================================================================
  redis:
    image: redis:7-alpine
    container_name: redis-kong
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_password}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ticket-katum-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================================================================
  # Konga (Admin UI)
  # ==================================================================
  konga:
    image: pantsel/konga:latest
    container_name: konga-ui
    environment:
      NODE_ENV: production
      DB_ADAPTER: postgres
      DB_HOST: kong-database
      DB_PORT: 5432
      DB_USER: kong
      DB_PASSWORD: ${KONG_DB_PASSWORD:-kong_password}
      DB_DATABASE: konga
      TOKEN_SECRET: ${KONGA_TOKEN_SECRET:-change-me}
    ports:
      - "1337:1337"
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - ticket-katum-network
    restart: unless-stopped

# ==================================================================
# Networks & Volumes
# ==================================================================
networks:
  ticket-katum-network:
    driver: bridge

volumes:
  kong-db-data:
  kong-logs:
  redis-data:
