server:
  port: 8086

spring:
  application:
    name: payment-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

    activemq:
      broker-url: tcp://localhost:61616
      user: ${ACTIVEMQ_USER:admin}
      password: ${ACTIVEMQ_PASSWORD:admin}


esewa:
  merchant-code: EPAYTEST
  success-url: http://localhost:3000/payments/esewa/success
  failure-url: http://localhost:3000/payments/esewa/failure
  base-url: https://rc-epay.esewa.com.np/api/epay/main/v2/form
  verify-url: https://rc-epay.esewa.com.np/api/epay/transaction/status
  secret-key: "8gBm/:&EnhH.1/q"

  kafka:
    kafka:
      bootstrap-servers: localhost:9092
      consumer:
        auto-offset-reset: earliest
        enable-auto-commit: false
        properties:
          isolation.level: read_committed
      producer:
        acks: all

sendgrid:
  api:
    key: ${SENDGRID_API_KEY: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}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
