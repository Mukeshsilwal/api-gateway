server:
  port: 8083

spring:
  application:
    name: bus-service

  datasource:
    url: jdbc:postgresql://localhost:5432/bus_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      host: localhost
      port: 6379

sendgrid:
  api:
    key: ${SENDGRID_API_KEY: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}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
