server:
  port: 8081

spring:
  application:
    name: bus-service

  datasource:
    url: jdbc:postgresql://localhost:5432/bus_service
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      port: 6379
      host: localhost

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
