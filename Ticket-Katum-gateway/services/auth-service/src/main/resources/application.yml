# ============================
# JWT Configuration
# ============================
jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyThatIsAtLeast32CharactersLongAndRandomlyGenerated}

  expiration:
    time: ${JWT_EXPIRATION:3600000}          # 1 hour

  refresh:
    expiration:
      time: ${JWT_REFRESH_EXPIRATION:86400000}   # 24 hours

# ============================
# Spring Configuration
# ============================
spring:
  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:changeme}

  session:
    store-type: redis

    data:
      redis:
        host: localhost       # Redis host
        port: 6379            # Redis port
        password: ""          # Redis password if any
        timeout: 6000ms
  # DATABASE (PostgreSQL)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update     # Creates/updates tables automatically
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ============================
# Logging
# ============================
logging:
  level:
    com.ticketkatum.security: DEBUG
    org.springframework.security: INFO
    io.jsonwebtoken: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# ============================
# Server Configuration
# ============================
server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# ============================
# SendGrid Email Service
# ============================
sendgrid:
  api:
    key: ${SENDGRID_API_KEY:SG.fakeKey.PLEASE_REPLACE}

# ============================
# Actuator (for health checks)
# ============================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
