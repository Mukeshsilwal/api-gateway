# JWT Configuration
jwt:
  # IMPORTANT: Use a strong, randomly generated secret key (minimum 32 characters)
  # Generate using: openssl rand -base64 32
  # Store in environment variable in production: ${JWT_SECRET}
  secret: ${JWT_SECRET:YourSuperSecretKeyThatIsAtLeast32CharactersLongAndRandomlyGenerated}

  # Access token expiration (1 hour = 3600000ms)
  expiration:
    time: ${JWT_EXPIRATION:3600000}

  # Refresh token expiration (24 hours = 86400000ms)
  refresh:
    expiration:
      time: ${JWT_REFRESH_EXPIRATION:86400000}

# Spring Security Configuration
spring:
  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:changeme}

  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ticketkatum}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

# Logging Configuration
logging:
  level:
    com.ticketkatum.security: DEBUG
    org.springframework.security: INFO
    io.jsonwebtoken: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# Actuator Configuration (for health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized