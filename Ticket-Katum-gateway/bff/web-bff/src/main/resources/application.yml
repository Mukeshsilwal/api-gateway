spring:
  application:
    name: ticket-katum-web-bff

  # Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# Microservices URLs
microservices:
  hotel-service-url: ${HOTEL_SERVICE_URL:http://localhost:8081}
  recommendation-service-url: ${RECOMMENDATION_SERVICE_URL:http://localhost:8082}
  payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
  maintenance-service-url: ${MAINTENANCE_SERVICE_URL:http://localhost:8084}
  staff-service-url: ${STAFF_SERVICE_URL:http://localhost:8085}
  image-service-url: ${IMAGE_SERVICE_URL:http://localhost:8086}
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8087}
  user-service-url: ${USER_SERVICE_URL:http://localhost:8088}
  booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8089}

  # Timeout Configuration
  timeout:
    connection-timeout: 5000
    response-timeout: 10000
    read-timeout: 10000

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      hotelService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException

      recommendationService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50

      paymentService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 15s
        failureRateThreshold: 30
        recordExceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException

      maintenanceService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50

      staffService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50

      imageService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50

      authService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 30
        recordExceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException

      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50

      bookingService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 15s
        failureRateThreshold: 40

  retry:
    instances:
      hotel-service:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException

      recommendation-service:
        maxAttempts: 3
        waitDuration: 500ms

      payment-service:
        maxAttempts: 2
        waitDuration: 1s

      maintenance-service:
        maxAttempts: 3
        waitDuration: 500ms

      staff-service:
        maxAttempts: 3
        waitDuration: 500ms

      image-service:
        maxAttempts: 2
        waitDuration: 1s

      auth-service:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException

      user-service:
        maxAttempts: 3
        waitDuration: 500ms

      booking-service:
        maxAttempts: 2
        waitDuration: 1s

  bulkhead:
    instances:
      hotelService:
        maxConcurrentCalls: 50
        maxWaitDuration: 500ms

      recommendationService:
        maxConcurrentCalls: 50
        maxWaitDuration: 500ms

      paymentService:
        maxConcurrentCalls: 20
        maxWaitDuration: 1s

# Thread Pool Configuration for Async Operations
async:
  executor:
    core-pool-size: 10
    max-pool-size: 50
    queue-capacity: 100
    thread-name-prefix: bff-async-

# Logging Configuration
logging:
  level:
    root: INFO
    com.ticketkatum: DEBUG
    org.springframework.web: DEBUG
    io.github.resilience4j: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/web-bff.log
    max-size: 10MB
    max-history: 30

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: true

# CORS Configuration
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:4200
    - https://ticketkatum.com
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Cache Configuration (if using Redis)
cache:
  enabled: true
  ttl: 300 # 5 minutes
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0

# Rate Limiting
rate-limit:
  enabled: true
  requests-per-minute: 100
  burst-capacity: 200

# Monitoring and Tracing
tracing:
  enabled: true
  jaeger:
    host: ${JAEGER_HOST:localhost}
    port: ${JAEGER_PORT:6831}

# Feature Flags
features:
  personalized-recommendations: true
  batch-operations: true
  advanced-search: true
  payment-integration: true
  cache-warming: true