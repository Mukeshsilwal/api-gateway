spring:
  application:
    name: web-bff

  # ========================================
  # Server Configuration
  # ========================================
  server:
    port: ${SERVER_PORT:8081}
    compression:
      enabled: true
      mime-types:
        - application/json
        - application/xml
        - text/html
    http2:
      enabled: true
    shutdown: graceful
    error:
      include-message: always
      include-binding-errors: always

  # ========================================
  # Jackson Configuration
  # ========================================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: Asia/Kathmandu

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes
      cache-null-values: false
      key-prefix: "web-bff:"
      use-key-prefix: true

  # ========================================
  # Lifecycle Configuration
  # ========================================
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD:}
      database: 0

# ========================================
# Service URLs
# ========================================
services:
  booking:
    url: ${BOOKING_SERVICE_URL:http://localhost:8091}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8092}
  hotel:
    url: ${HOTEL_SERVICE_URL:http://localhost:8093}
  movies:
    url: ${MOVIES_SERVICE_URL:http://localhost:8094}

# ========================================
# WebClient Configuration
# ========================================
webclient:
  connection-timeout: ${WEBCLIENT_CONNECTION_TIMEOUT:5000}
  read-timeout: ${WEBCLIENT_READ_TIMEOUT:30000}
  write-timeout: ${WEBCLIENT_WRITE_TIMEOUT:30000}
  max-connections: ${WEBCLIENT_MAX_CONNECTIONS:500}
  pending-acquire-timeout: ${WEBCLIENT_PENDING_TIMEOUT:45000}
  max-in-memory-size: 10485760 # 10MB

# ========================================
# JWT Configuration
# ========================================
jwt:
  secret: ${JWT_SECRET:your-secret-key-min-256-bits-long-for-security-purposes-change-in-production-environment}
  expiration: 86400000 # 24 hours

# ========================================
# Resilience4j Configuration
# ========================================
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 5s
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
    instances:
      bookingService:
        baseConfig: default
        waitDurationInOpenState: 20s
        failureRateThreshold: 40
      paymentService:
        baseConfig: default
        failureRateThreshold: 30
        waitDurationInOpenState: 45s
        minimumNumberOfCalls: 10
      hotelService:
        baseConfig: default
        slidingWindowSize: 20
        failureRateThreshold: 50
      moviesService:
        baseConfig: default
        slidingWindowSize: 15

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1000ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.net.ConnectException
          - org.springframework.web.reactive.function.client.WebClientRequestException
        ignoreExceptions:
          - java.lang.IllegalArgumentException
    instances:
      bookingService:
        baseConfig: default
        maxAttempts: 2
        waitDuration: 500ms
      paymentService:
        baseConfig: default
        maxAttempts: 3
        waitDuration: 2000ms
      hotelService:
        baseConfig: default
      moviesService:
        baseConfig: default

  ratelimiter:
    configs:
      default:
        registerHealthIndicator: true
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0s
    instances:
      bookingService:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
      paymentService:
        limitForPeriod: 30
        limitRefreshPeriod: 1s

  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 25
        maxWaitDuration: 0ms
    instances:
      bookingService:
        maxConcurrentCalls: 50
      paymentService:
        maxConcurrentCalls: 30
      hotelService:
        maxConcurrentCalls: 40
      moviesService:
        maxConcurrentCalls: 40

  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
        cancelRunningFuture: true
    instances:
      bookingService:
        timeoutDuration: 20s
      paymentService:
        timeoutDuration: 30s
      hotelService:
        timeoutDuration: 15s
      moviesService:
        timeoutDuration: 15s

# ========================================
# Actuator Configuration
# ========================================
management:
  endpoints:
    web:
      exposure:
        include: >
          health,
          info,
          metrics,
          prometheus,
          circuitbreakers,
          circuitbreakerevents,
          ratelimiters,
          retries,
          bulkheads,
          caches
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis,diskSpace
        liveness:
          include: livenessState,ping
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  prometheus:
    metrics:
      export:
        enabled: true

# ========================================
# Logging Configuration
# ========================================
logging:
  level:
    root: INFO
    com.ticketkatum: ${LOG_LEVEL:DEBUG}
    com.ticketkatum.webbff.client: DEBUG
    com.ticketkatum.webbff.service: DEBUG
    com.ticketkatum.webbff.controller: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    io.github.resilience4j: INFO
    reactor.netty: INFO
    org.springframework.data.redis: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}/%X{spanId}] [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/web-bff.log}
    max-size: ${LOG_FILE_MAX_SIZE:10MB}
    max-history: ${LOG_FILE_MAX_HISTORY:30}
    total-size-cap: ${LOG_FILE_TOTAL_SIZE:1GB}

# ========================================
# SpringDoc OpenAPI Configuration
# ========================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    filter: true
    doc-expansion: none
  show-actuator: true
  packages-to-scan: com.ticketkatum.webbff.controller
  paths-to-match: /api/**

# ========================================
# Custom Application Properties
# ========================================
app:
  name: TicketKatum Web BFF
  version: 1.0.0
  description: Backend for Frontend service for web clients
  features:
    circuit-breaker: true
    retry: true
    rate-limiting: true
    caching: true
    tracing: true

---
# ========================================
# DEVELOPMENT PROFILE
# ========================================
spring:
  config:
    activate:
      on-profile: dev

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

logging:
  level:
    com.ticketkatum: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    io.github.resilience4j: DEBUG

management:
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 70 # More lenient in dev

---
# ========================================
# STAGING PROFILE
# ========================================
spring:
  config:
    activate:
      on-profile: staging

services:
  booking:
    url: http://booking-service.staging.svc.cluster.local:8091
  payment:
    url: http://payment-service.staging.svc.cluster.local:8092
  hotel:
    url: http://hotel-service.staging.svc.cluster.local:8093
  movies:
    url: http://movies-service.staging.svc.cluster.local:8094

logging:
  level:
    com.ticketkatum: INFO

management:
  tracing:
    sampling:
      probability: 0.5 # 50% sampling in staging

---
# ========================================
# PRODUCTION PROFILE
# ========================================
spring:
  config:
    activate:
      on-profile: prod

services:
  booking:
    url: http://booking-service.production.svc.cluster.local:8091
  payment:
    url: http://payment-service.production.svc.cluster.local:8092
  hotel:
    url: http://hotel-service.production.svc.cluster.local:8093
  movies:
    url: http://movies-service.production.svc.cluster.local:8094

logging:
  level:
    root: WARN
    com.ticketkatum: INFO
    com.ticketkatum.webbff.client: INFO

management:
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 0.1 # 10% sampling in production

resilience4j:
  circuitbreaker:
    configs:
      default:
        minimumNumberOfCalls: 10
        failureRateThreshold: 40
        waitDurationInOpenState: 60s

# Production JVM options (set via environment)
# JAVA_OPTS: >
#   -Xms1g -Xmx2g
#   -XX:+UseG1GC
#   -XX:MaxGCPauseMillis=200
#   -XX:+UseStringDeduplication
#   -XX:+HeapDumpOnOutOfMemoryError
#   -XX:HeapDumpPath=/app/logs/heap-dump.hprof