version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-local
    environment:
      POSTGRES_USER: ticketkatum
      POSTGRES_PASSWORD: ticketkatum_password
      POSTGRES_DB: ticketkatum
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-local:/var/lib/postgresql/data
      - ./infra/docker-init/create-dbs.sql:/docker-entrypoint-initdb.d/create-dbs.sql:ro
    networks:
      - ticket-katum-network

  redis:
    image: redis:7-alpine
    container_name: redis-local
    command: redis-server --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis-data-local:/data
    networks:
      - ticket-katum-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-local
    environment:
      RABBITMQ_DEFAULT_USER: ticketkatum
      RABBITMQ_DEFAULT_PASS: ticketkatum_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data-local:/var/lib/rabbitmq
    networks:
      - ticket-katum-network

  kong-database:
    image: postgres:15-alpine
    container_name: kong-db-local
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong_password
    volumes:
      - kong-db-data-local:/var/lib/postgresql/data
    networks:
      - ticket-katum-network

  kong-migration:
    image: kong:3.4
    container_name: kong-migration-local
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
    depends_on:
      - kong-database
    networks:
      - ticket-katum-network

  kong:
    image: kong:3.4
    container_name: kong-gateway-local
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - kong-database
      - kong-migration
    networks:
      - ticket-katum-network

  web-bff:
    build:
      context: .
      dockerfile: bff/web-bff/Dockerfile
    container_name: web-bff-local
    environment:
      SPRING_PROFILES_ACTIVE: dev
      BOOKING_SERVICE_URL: http://booking-service-local:8091
      PAYMENT_SERVICE_URL: http://payment-service-local:8092
      HOTEL_SERVICE_URL: http://hotel-service-local:8093
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8081
      REDIS_PASSWORD: redis_password
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
      MANAGEMENT_ENDPOINTS_ENV_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis_password
      SPRING_REDIS_PASSWORD: redis_password
    ports:
      - "8081:8081"
    depends_on:
      - booking-service
      - payment-service
      - hotel-service
      - redis
    networks:
      - ticket-katum-network

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    container_name: booking-service-local
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_db
      SPRING_DATASOURCE_USERNAME: ticketkatum
      SPRING_DATASOURCE_PASSWORD: ticketkatum_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      REDIS_PASSWORD: redis_password
    ports:
      - "8091:8091"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - ticket-katum-network

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: payment-service-local
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ticketkatum
      SPRING_DATASOURCE_PASSWORD: ticketkatum_password
    ports:
      - "8092:8092"
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - ticket-katum-network

  hotel-service:
    build:
      context: .
      dockerfile: services/hotel-service/Dockerfile
    container_name: hotel-service-local
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel_db
      SPRING_DATASOURCE_USERNAME: ticketkatum
      SPRING_DATASOURCE_PASSWORD: ticketkatum_password
    ports:
      - "8093:8093"
    depends_on:
      - postgres
      - redis
    networks:
      - ticket-katum-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service-local
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketkatum
      SPRING_DATASOURCE_USERNAME: ticketkatum
      SPRING_DATASOURCE_PASSWORD: ticketkatum_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password
    ports:
      - "8090:8090"
    depends_on:
      - postgres
      - redis
    networks:
      - ticket-katum-network

  bus-service:
    build:
      context: .
      dockerfile: services/bus-service/Dockerfile
    container_name: bus-service-local
    ports:
      - "8086:8086"
    networks:
      - ticket-katum-network

networks:
  ticket-katum-network:
    driver: bridge

volumes:
  postgres-data-local:
  redis-data-local:
  rabbitmq-data-local:
  kong-db-data-local:
