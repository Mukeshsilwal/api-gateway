[build]
builder = "DOCKERFILE"

# --- Infrastructure ---

[[services]]
name = "eureka-server"
path = "."
dockerfilePath = "eureka-server/Dockerfile"
[services.deploy]
startCommand = "java -jar target/*.jar"
healthcheckPath = "/actuator/health"
restartPolicyType = "ON_FAILURE"

[[services]]
name = "gateway"
path = "."
dockerfilePath = "gateway/Dockerfile"
[services.deploy]
startCommand = "java -jar target/*.jar"
healthcheckPath = "/actuator/health"
restartPolicyType = "ON_FAILURE"

