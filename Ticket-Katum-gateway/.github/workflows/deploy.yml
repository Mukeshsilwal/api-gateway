name: Build, Push and Deploy

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build artifacts (Maven)
        run: |
          # Check if pom.xml exists in root
          if [ ! -f pom.xml ]; then
            echo "No pom.xml found in root directory. Skipping Maven build."
            echo "Docker builds will use pre-built artifacts or build within Dockerfile."
            exit 0
          fi
          
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw -T1C -DskipTests clean package
          else
            mvn -T1C -DskipTests clean package
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker images
        env:
          OWNER_LC: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(echo "$OWNER_LC" | tr '[:upper:]' '[:lower:]')
          
          # Array of services with their Dockerfile paths
          declare -A services=(
            ["web-bff"]="bff/web-bff/Dockerfile"
            ["booking-service"]="services/booking-service/Dockerfile"
            ["payment-service"]="services/payment-service/Dockerfile"
            ["hotel-service"]="services/hotel-service/Dockerfile"
            ["auth-service"]="services/auth-service/Dockerfile"
          )
          
          for service in "${!services[@]}"; do
            dockerfile="${services[$service]}"
          
            if [ -f "$dockerfile" ]; then
              echo "Building and pushing ${service}..."
              docker build -t ghcr.io/${OWNER_LC}/${service}:${{ github.sha }} -f "$dockerfile" .
              docker push ghcr.io/${OWNER_LC}/${service}:${{ github.sha }}
            else
              echo "Warning: Dockerfile not found at ${dockerfile}, skipping ${service}"
            fi
          done

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          OWNER_LC: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          OWNER_LC=$(echo "$OWNER_LC" | tr '[:upper:]' '[:lower:]')
          REGISTRY="ghcr.io/${OWNER_LC}"
          
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA secret is not set"
            exit 1
          fi
          echo "$KUBECONFIG_DATA" | base64 --decode > kubeconfig

          mkdir -p k8s-deploy
          if [ -d infra/k8s ]; then
            cp infra/k8s/* k8s-deploy/ || true
          fi

          # Generate kustomization.yaml
          echo "resources:" > k8s-deploy/kustomization.yaml
          for f in k8s-deploy/*.yaml; do
            if [ -f "$f" ]; then
              echo "  - $(basename "$f")" >> k8s-deploy/kustomization.yaml
            fi
          done

          echo "images:" >> k8s-deploy/kustomization.yaml
          
          echo "  - name: ticketkatum/booking-service" >> k8s-deploy/kustomization.yaml
          echo "    newName: ${REGISTRY}/booking-service" >> k8s-deploy/kustomization.yaml
          echo "    newTag: ${IMAGE_TAG}" >> k8s-deploy/kustomization.yaml

          echo "  - name: web-bff" >> k8s-deploy/kustomization.yaml
          echo "    newName: ${REGISTRY}/web-bff" >> k8s-deploy/kustomization.yaml
          echo "    newTag: ${IMAGE_TAG}" >> k8s-deploy/kustomization.yaml

          echo "  - name: payment-service" >> k8s-deploy/kustomization.yaml
          echo "    newName: ${REGISTRY}/payment-service" >> k8s-deploy/kustomization.yaml
          echo "    newTag: ${IMAGE_TAG}" >> k8s-deploy/kustomization.yaml

          echo "  - name: hotel-service" >> k8s-deploy/kustomization.yaml
          echo "    newName: ${REGISTRY}/hotel-service" >> k8s-deploy/kustomization.yaml
          echo "    newTag: ${IMAGE_TAG}" >> k8s-deploy/kustomization.yaml

          echo "  - name: auth-service" >> k8s-deploy/kustomization.yaml
          echo "    newName: ${REGISTRY}/auth-service" >> k8s-deploy/kustomization.yaml
          echo "    newTag: ${IMAGE_TAG}" >> k8s-deploy/kustomization.yaml

          # Apply deployment
          kubectl --kubeconfig=kubeconfig apply -k k8s-deploy

          # Wait for rollout
          for deploy in web-bff booking-service payment-service hotel-service auth-service; do
            kubectl --kubeconfig=kubeconfig rollout status deployment/$deploy --timeout=120s || true
          done

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f kubeconfig