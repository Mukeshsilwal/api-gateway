name: Build, Push and Deploy to AWS EKS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build artifacts (Maven)
        run: |
          chmod +x mvnw
          ./mvnw -T1C -DskipTests clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push web-bff image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: bff/web-bff/Dockerfile
          push: true
          tags: ${{ secrets.ECR_WEB_BFF }}:${{ github.sha }}

      - name: Build & push booking-service image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: services/booking-service/Dockerfile
          push: true
          tags: ${{ secrets.ECR_BOOKING_SERVICE }}:${{ github.sha }}

      - name: Build & push payment-service image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: services/payment-service/Dockerfile
          push: true
          tags: ${{ secrets.ECR_PAYMENT_SERVICE }}:${{ github.sha }}

      - name: Build & push hotel-service image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: services/hotel-service/Dockerfile
          push: true
          tags: ${{ secrets.ECR_HOTEL_SERVICE }}:${{ github.sha }}

      - name: Build & push auth-service image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: services/auth-service/Dockerfile
          push: true
          tags: ${{ secrets.ECR_AUTH_SERVICE }}:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ticket-katum-cluster

      - name: Deploy to Kubernetes (kustomize image patch)
        env:
          REGISTRY_WEB_BFF: ${{ secrets.ECR_WEB_BFF }}
          REGISTRY_BOOKING: ${{ secrets.ECR_BOOKING_SERVICE }}
          REGISTRY_PAYMENT: ${{ secrets.ECR_PAYMENT_SERVICE }}
          REGISTRY_HOTEL: ${{ secrets.ECR_HOTEL_SERVICE }}
          REGISTRY_AUTH: ${{ secrets.ECR_AUTH_SERVICE }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p k8s-deploy
          if [ -d infra/k8s ]; then
            cp infra/k8s/* k8s-deploy/ || true
          fi

          echo "resources:" > k8s-deploy/kustomization.yaml
          for f in k8s-deploy/*.yaml; do
            [ -f "$f" ] || continue
            echo "  - $(basename "$f")" >> k8s-deploy/kustomization.yaml
          done

          cat >> k8s-deploy/kustomization.yaml <<KUSTOMIZE_IMAGES
images:
  - name: web-bff
    newName: ${REGISTRY_WEB_BFF}
    newTag: ${IMAGE_TAG}
  - name: booking-service
    newName: ${REGISTRY_BOOKING}
    newTag: ${IMAGE_TAG}
  - name: payment-service
    newName: ${REGISTRY_PAYMENT}
    newTag: ${IMAGE_TAG}
  - name: hotel-service
    newName: ${REGISTRY_HOTEL}
    newTag: ${IMAGE_TAG}
  - name: auth-service
    newName: ${REGISTRY_AUTH}
    newTag: ${IMAGE_TAG}
  KUSTOMIZE_IMAGES
  
  kubectl apply -k k8s-deploy || {
  echo "Kustomize apply failed; using kubectl set image fallback"
  kubectl set image deployment/web-bff web-bff=${REGISTRY_WEB_BFF}:${IMAGE_TAG} --record || true
  kubectl set image deployment/booking-service booking-service=${REGISTRY_BOOKING}:${IMAGE_TAG} --record || true
  kubectl set image deployment/payment-service payment-service=${REGISTRY_PAYMENT}:${IMAGE_TAG} --record || true
  kubectl set image deployment/hotel-service hotel-service=${REGISTRY_HOTEL}:${IMAGE_TAG} --record || true
  kubectl set image deployment/auth-service auth-service=${REGISTRY_AUTH}:${IMAGE_TAG} --record || true
  }

  kubectl rollout status deployment/web-bff --timeout=120s || true
  kubectl rollout status deployment/booking-service --timeout=120s || true
  kubectl rollout status deployment/payment-service --timeout=120s || true
  kubectl rollout status deployment/hotel-service --timeout=120s || true
  kubectl rollout status deployment/auth-service --timeout=120s || true
